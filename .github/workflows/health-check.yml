name: API Health Check
on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 12 * * 1' # This runs the check every Monday at noon, just to practice

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Call the API endpoint
        run: |
          curl https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec?path=Requests
